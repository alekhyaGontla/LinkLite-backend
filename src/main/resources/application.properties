# ===============================
# Application
# ===============================
spring.application.name=linklite

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# PostgreSQL (Supabase / any Postgres)
# ===============================
# NOTE: In production, com.linklite.config.DatabaseConfig defines the
# @Primary DataSource bean and reads DATABASE_URL directly
# (format: postgres://user:pass@host:port/dbname or postgresql://...).
# The properties below are only used as the local-dev fallback when
# DATABASE_URL is not set.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================
# Redis
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ===============================
# Application Base URL
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# CORS - comma-separated allowed origins
# ===============================
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
